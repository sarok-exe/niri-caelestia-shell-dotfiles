include                 theme.conf
include                 ~/.cache/matugen/kitty/colors.conf
font_family             JetBrainsMono Nerd Font Mono Bold
font_size               14
window_padding_width    1
italic_font             auto
bold_font               auto
bold_italic_font        auto
background_opacity      1.0
dynamic_background_opacity no
# copy_on_select no
scrollbar               never
confirm_os_window_close 0
strip_trailing_spaces   smart
open_url_with           default
detect_urls             yes
cursor_shape            beam
cursor_beam_thickness   1.5
cursor_blink_interval   -1

# Wallpaper settings (set by wallpaper-random)
background_tint 0.7
background_anchoring top

# Performance optimizations for HDD
startup_session         none
initial_window_size     80x24
remember_window_size    no
startup_notification     no
disable_ligatures       never
box_drawing_scale       0.001,1.0,1.0,1.0

# Reduce I/O
repaint_delay           10
input_delay             3
sync_to_monitor         no

# Startup speed
fast_resize             yes
watch_timeout           0
