<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!-- ============================================ -->
  <!-- Arabic Unicode -> Koft Arabic default          -->
  <!-- Koft Arabic is the system default font;       -->
  <!-- Irancell is kept as a fallback.               -->
  <!-- ============================================ -->

  <!-- Global Arabic script preference (lang=ar) -->
  <match target="pattern">
    <test name="lang" compare="contains">
      <string>ar</string>
    </test>
    <edit name="family" mode="prepend_first">
      <string>Koft Arabic</string>
      <string>Irancell</string>
    </edit>
  </match>

  <!-- Force Koft Arabic to be treated as monospace.
       kitty only uses fonts with fontconfig spacing 90-100,
       and Koft Arabic has no spacing value (proportional). -->
  <match target="pattern">
    <test name="family" compare="contains">
      <string>Koft Arabic</string>
    </test>
    <edit name="spacing" mode="assign" binding="strong">
      <int>100</int>
    </edit>
  </match>

  <!-- JetBrainsMono fallback for Arabic chars -->
  <match target="pattern">
    <test name="family" compare="eq">
      <string>JetBrainsMono Nerd Font Mono</string>
    </test>
    <edit name="family" mode="append">
      <string>Koft Arabic</string>
      <string>Irancell</string>
      <string>Noto Sans Arabic</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq">
      <string>JetBrainsMono Nerd Font</string>
    </test>
    <edit name="family" mode="append">
      <string>Koft Arabic</string>
      <string>Irancell</string>
      <string>Noto Sans Arabic</string>
    </edit>
  </match>

  <!-- CaskaydiaCove fallback -->
  <match target="pattern">
    <test name="family" compare="contains">
      <string>CaskaydiaCove</string>
    </test>
    <edit name="family" mode="append">
      <string>Koft Arabic</string>
      <string>Irancell</string>
    </edit>
  </match>

  <!-- ============================================ -->
  <!-- Reject FreeMono for Arabic script             -->
  <!-- ============================================ -->
  <selectfont>
    <rejectfont>
      <pattern>
        <patelt name="family">
          <string>FreeMono</string>
        </patelt>
      </pattern>
    </rejectfont>
  </selectfont>

  <!-- ============================================ -->
  <!-- Generic family aliases                        -->
  <!-- ============================================ -->
  <alias>
    <family>serif</family>
    <prefer>
      <family>Irancell</family>
      <family>Koft Arabic</family>
      <family>Noto Serif</family>
      <family>Joy Pixels</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>Irancell</family>
      <family>Koft Arabic</family>
      <family>Noto Sans</family>
      <family>Joy Pixels</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>
  <alias>
    <family>monospace</family>
    <prefer>
      <family>Noto Sans Mono</family>
      <family>Joy Pixels</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>
  <alias>
    <family>sans</family>
    <prefer>
      <family>Irancell</family>
      <family>Koft Arabic</family>
      <family>Noto Sans</family>
      <family>Joy Pixels</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>

  <!-- Arabic family mappings -->
  <alias>
    <family>Arabic</family>
    <prefer>
      <family>Irancell</family>
      <family>Koft Arabic</family>
    </prefer>
  </alias>
  <alias>
    <family>Noto Sans Arabic</family>
    <prefer>
      <family>Irancell</family>
      <family>Koft Arabic</family>
    </prefer>
  </alias>

  <!-- Emoji -->
  <alias>
    <family>emoji</family>
    <prefer>
      <family>Joy Pixels</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>
</fontconfig>
